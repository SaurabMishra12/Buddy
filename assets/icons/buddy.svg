<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Cape swoop -->
  <path d="M 44 48 C 28 62, 24 88, 32 98 C 42 96, 48 82, 52 66 Z" fill="#e11d48" opacity="0.9"/>

  <!-- Character Head -->
  <circle cx="64" cy="44" r="18" fill="#fbcfe8" />
  
  <!-- Silver Winged Helmet -->
  <path d="M 46 44 A 18 18 0 0 1 82 44 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <rect x="44" y="42" width="40" height="4" rx="2" fill="#fbbf24"/>
  <!-- Helmet Wing Left -->
  <path d="M 48 42 L 34 26 L 38 32 L 32 38 L 46 44 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <!-- Helmet Wing Right -->
  <path d="M 80 42 L 94 26 L 90 32 L 96 38 L 82 44 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>

  <!-- Torso armor with silver discs -->
  <rect x="52" y="60" width="24" height="26" rx="4" fill="#334155"/>
  <circle cx="58" cy="67" r="3.2" fill="#e2e8f0"/>
  <circle cx="70" cy="67" r="3.2" fill="#e2e8f0"/>
  <circle cx="58" cy="77" r="3.2" fill="#e2e8f0"/>
  <circle cx="70" cy="77" r="3.2" fill="#e2e8f0"/>
  <rect x="50" y="84" width="28" height="5" fill="#f59e0b"/>

  <!-- Lightning Bolt Symbol -->
  <polygon points="68,20 54,48 64,48 58,74 78,42 66,42" fill="url(#lightningGrad)" filter="url(#glow)"/>
</svg>
